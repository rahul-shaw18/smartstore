{{title()}}

<form class="example-form">
    <mat-form-field class="example-full-width">
      <mat-label>Favorite food</mat-label>
      <input matInput placeholder="Ex. Pizza" name="favoriteFood" value="Sushi" [(ngModel)]="formValue">
    </mat-form-field>
</form>


<button matButton="filled" (click)="count = count + 1">INC</button>
{{count}}
<button matButton="outlined" (click)="count = count - 1">DEC</button>

<router-outlet />
